name: CI

# Le pipeline de l'équipe : linter et tests à chaque push.
on:
  push:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer le linter
        run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - name: Installer les dépendances
        run: npm ci
      - name: Lancer les tests unitaires
        run: npm test
